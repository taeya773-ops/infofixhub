main:
  params: [input]
  steps:
    - validateInput:
        switch:
          - condition: ${not("questionId" in input)}
            raise: "questionId is required"
    - initialize:
        assign:
          - projectId: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - questionId: ${input.questionId}
          - userNotes: ${default(map.get(input, "userNotes"), "")}
          - sources: []
          - evidence: []
    - readAutomationToken:
        call: googleapis.secretmanager.v1.projects.secrets.versions.accessString
        args:
          secret_id: infofixhub-automation-token
          version: latest
          project_id: ${projectId}
        result: automationToken
    - getQuestion:
        call: http.get
        args:
          url: '${"https://infofixhub.org/api/automation/questions/" + questionId}'
          timeout: 30
          headers:
            Authorization: ${"Bearer " + automationToken}
        result: questionResponse
    - markResearching:
        call: http.patch
        args:
          url: '${"https://infofixhub.org/api/automation/questions/" + questionId}'
          timeout: 30
          headers:
            Content-Type: "application/json"
            Authorization: ${"Bearer " + automationToken}
          body:
            status: "RESEARCHING"
    - readSearchApiKey:
        call: googleapis.secretmanager.v1.projects.secrets.versions.accessString
        args:
          secret_id: serpapi-api-key
          version: latest
          project_id: ${projectId}
        result: searchApiKey
    - searchGoogle:
        call: http.get
        args:
          url: "https://serpapi.com/search.json"
          timeout: 30
          query:
            engine: "google"
            q: '${questionResponse.body.question.title + " " + userNotes}'
            google_domain: "google.co.kr"
            hl: "ko"
            gl: "kr"
            num: 10
            api_key: ${searchApiKey}
        result: searchResponse
    - collectSources:
        for:
          value: item
          in: ${default(map.get(searchResponse.body, "organic_results"), [])}
          steps:
            - sourceMap:
                assign:
                  - source:
                      title: ${default(map.get(item, "title"), "검색 자료")}
                      url: ${item.link}
                      domain: ${default(map.get(item, "displayed_link"), item.link)}
                  - evidenceItem:
                      title: ${default(map.get(item, "title"), "검색 자료")}
                      url: ${item.link}
                      snippet: ${default(map.get(item, "snippet"), "")}
            - appendSource:
                assign:
                  - sources: ${list.concat(sources, source)}
                  - evidence: ${list.concat(evidence, evidenceItem)}
    - buildResearchInput:
        call: http.post
        args:
          url: "https://infofixhub.org/api/automation/research"
          timeout: 180
          headers:
            Content-Type: "application/json"
            Authorization: ${"Bearer " + automationToken}
          body:
            question: ${questionResponse.body.question.title}
            userNotes: ${userNotes}
            sources: ${evidence}
        result: deepResearchResponse
    - useDeepResearch:
        assign:
          - sources: ${deepResearchResponse.body.sources}
          - evidence: ${deepResearchResponse.body.evidence}
          - researchPayload:
              question: ${questionResponse.body.question.title}
              research: ${deepResearchResponse.body.research}
              crawlStats: ${deepResearchResponse.body.crawlStats}
          - promptText: '${"질문: " + questionResponse.body.question.title + "\n사용자 메모(직접 경험과 반드시 반영할 초점; 비어 있으면 없음): " + userNotes + "\n원문 기반 AI Research JSON: " + json.encode_to_string(researchPayload)}'
    - readOpenAiApiKey:
        call: googleapis.secretmanager.v1.projects.secrets.versions.accessString
        args:
          secret_id: openai-api-key
          version: latest
          project_id: ${projectId}
        result: openaiApiKey
    - writeDraft:
        call: http.post
        args:
          url: "https://api.openai.com/v1/responses"
          timeout: 90
          headers:
            Content-Type: "application/json"
            Authorization: ${"Bearer " + openaiApiKey}
          body:
            model: "gpt-4.1-mini"
            store: false
            max_output_tokens: 4000
            instructions: "당신은 한국어 검색 가이드 편집자이자 스크린샷 감독자입니다. 제공된 검색 자료에 근거해 정확하고 실용적인 답변 초안을 작성하세요. 사용자 메모의 직접 경험과 감상은 필자의 체험으로 자연스럽게 반영하되, 역사·교통·가격·운영 정보는 검색 근거로 확인하고 단정적 오해를 바로잡으세요. 확인되지 않은 사실이나 장소·공연은 만들지 마세요. 실제 문제, 단계별 해결, 주의사항, 확인 방법을 포함하고 출처 링크를 본문 끝에 정리하세요. 광고 문구는 작성하지 마세요. 글을 읽은 사용자가 그대로 따라 할 수 있도록 screenshotPlan을 작성하세요. 공개 URL에서 로그인 없이 촬영 가능한 화면만 AUTO_PUBLIC_WEB로 분류하고 targetUrl을 넣으세요. 여러 클릭이나 로그인 세션이 필요한 웹 화면은 AUTO_COMPLEX, Windows 프로그램·게임·계정·환경변수·API Key 등 사용자의 실제 화면은 USER_REQUIRED로 분류하세요. 민감정보가 있을 수 있는 화면은 USER_REQUIRED로 하고 이유를 명시하세요. 존재하지 않는 URL, 버튼, 화면을 상상하지 마세요."
            input: ${promptText}
            text:
              format:
                type: "json_schema"
                name: "answer_draft"
                strict: true
                schema:
                  type: "object"
                  properties:
                    summary: {type: "string"}
                    contentMarkdown: {type: "string"}
                    contentHtml: {type: "string"}
                    metaTitle: {type: "string"}
                    metaDescription: {type: "string"}
                    confidenceScore: {type: "number"}
                    qualityScore: {type: "number"}
                    screenshotPlan:
                      type: "array"
                      items:
                        type: "object"
                        properties:
                          stepNumber: {type: "integer"}
                          insertAfter: {type: "string"}
                          captureType: {type: "string", enum: ["AUTO_PUBLIC_WEB", "AUTO_COMPLEX", "USER_REQUIRED"]}
                          requiredScreen: {type: "string"}
                          targetUrl: {type: ["string", "null"]}
                          targetSelector: {type: ["string", "null"]}
                          highlightDescription: {type: ["string", "null"]}
                          caption: {type: "string"}
                          altText: {type: "string"}
                          reason: {type: ["string", "null"]}
                        required: [stepNumber, insertAfter, captureType, requiredScreen, targetUrl, targetSelector, highlightDescription, caption, altText, reason]
                        additionalProperties: false
                  required: [summary, contentMarkdown, contentHtml, metaTitle, metaDescription, confidenceScore, qualityScore, screenshotPlan]
                  additionalProperties: false
        result: openaiResponse
    - parseDraft:
        assign:
          - draft: ${json.decode(openaiResponse.body.output[0].content[0].text)}
    - reviewAndReviseWithGemini:
        call: http.post
        args:
          url: "https://infofixhub.org/api/automation/review"
          timeout: 600
          headers:
            Content-Type: "application/json"
            Authorization: ${"Bearer " + automationToken}
          body:
            question: ${questionResponse.body.question.title}
            userNotes: ${userNotes}
            draft: ${draft}
            evidence: ${evidence}
            maxRevisions: 2
            minimumScore: 80
        result: reviewResponse
    - useReviewedDraft:
        assign:
          - draft: ${reviewResponse.body.draft}
    - storeDraft:
        call: http.post
        args:
          url: '${"https://infofixhub.org/api/automation/questions/" + questionId + "/draft"}'
          timeout: 30
          headers:
            Content-Type: "application/json"
            Authorization: ${"Bearer " + automationToken}
          body:
            summary: ${draft.summary}
            contentMarkdown: ${draft.contentMarkdown}
            contentHtml: ${draft.contentHtml}
            metaTitle: ${draft.metaTitle}
            metaDescription: ${draft.metaDescription}
            confidenceScore: ${draft.confidenceScore}
            qualityScore: ${draft.qualityScore}
            provider: "openai"
            model: "gpt-4.1-mini"
            evaluation:
              status: ${reviewResponse.body.evaluation.status}
              overallScore: ${reviewResponse.body.evaluation.overallScore}
              notes: ${reviewResponse.body.evaluation.notes}
              issues: ${reviewResponse.body.evaluation.issues}
              provider: ${reviewResponse.body.evaluator.provider}
              model: ${reviewResponse.body.evaluator.model}
              revisionCount: ${reviewResponse.body.revisionCount}
            sources: ${sources}
            screenshotPlan: ${draft.screenshotPlan}
        result: storedDraft
    - capturePublicScreenshots1:
        call: http.post
        args:
          url: '${"https://infofixhub.org/api/automation/questions/" + questionId + "/screenshots/capture"}'
          timeout: 180
          headers:
            Content-Type: "application/json"
            Authorization: ${"Bearer " + automationToken}
          body: {}
        result: screenshotCapture1
    - summarizeScreenshotCapture:
        assign:
          - screenshotOverallStatus: "MATCH"
          - screenshotResults: ${screenshotCapture1.body.results}
          - screenshotAttempted: ${screenshotCapture1.body.attempted}
    - routeScreenshotReview:
        switch:
          - condition: ${screenshotCapture1.body.overallStatus == "IMAGE_NEEDS_UPDATE"}
            next: markImageRegeneration
          - condition: ${screenshotCapture1.body.overallStatus == "TEXT_NEEDS_UPDATE"}
            next: markTextRevision
        next: markScreenshotMatch
    - markTextRevision:
        assign:
          - screenshotOverallStatus: "TEXT_NEEDS_UPDATE"
          - screenshotNextAction: "TEXT_REVISE"
          - screenshotCapture:
              questionId: ${questionId}
              attempted: ${screenshotAttempted}
              humanApprovalRequired: true
              overallStatus: ${screenshotOverallStatus}
              results: ${screenshotResults}
        next: applyTextRevision
    - applyTextRevision:
        call: http.post
        args:
          url: '${"https://infofixhub.org/api/automation/questions/" + questionId + "/screenshots/apply-text"}'
          timeout: 60
          headers:
            Content-Type: "application/json"
            Authorization: ${"Bearer " + automationToken}
          body: {}
        result: screenshotTextRevision
        next: returnDraft
    - markImageRegeneration:
        assign:
          - screenshotOverallStatus: "IMAGE_NEEDS_UPDATE"
          - screenshotNextAction: "IMAGE_REGENERATE"
          - screenshotCapture:
              questionId: ${questionId}
              attempted: ${screenshotAttempted}
              humanApprovalRequired: true
              overallStatus: ${screenshotOverallStatus}
              results: ${screenshotResults}
        next: returnDraft
    - markScreenshotMatch:
        assign:
          - screenshotOverallStatus: "MATCH"
          - screenshotNextAction: "MATCH"
          - screenshotCapture:
              questionId: ${questionId}
              attempted: ${screenshotAttempted}
              humanApprovalRequired: true
              overallStatus: ${screenshotOverallStatus}
              results: ${screenshotResults}
        next: returnDraft
    - returnDraft:
        return:
          workflow: "ANSWER_GENERATION"
          questionId: ${questionId}
          status: ${storedDraft.body.status}
          evaluationStatus: ${reviewResponse.body.evaluation.status}
          evaluationScore: ${reviewResponse.body.evaluation.overallScore}
          revisionCount: ${reviewResponse.body.revisionCount}
          humanApprovalRequired: true
          published: false
          adminPreviewUrl: ${storedDraft.body.adminPreviewUrl}
          publicUrl: ${storedDraft.body.publicUrl}
          pendingPublicUrl: ${storedDraft.body.pendingPublicUrl}
          indexTargetUrl: ${storedDraft.body.indexTargetUrl}
          screenshotCapture: ${screenshotCapture}
          screenshotReviewStatus: ${screenshotCapture.overallStatus}
          screenshotNextAction: ${screenshotNextAction}
          userNotesApplied: ${userNotes != ""}
