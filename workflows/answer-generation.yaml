main:
  params: [input]
  steps:
    - validateInput:
        switch:
          - condition: ${not("questionId" in input)}
            raise: "questionId is required"
    - initialize:
        assign:
          - projectId: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - questionId: ${input.questionId}
          - sources: []
    - readAutomationToken:
        call: googleapis.secretmanager.v1.projects.secrets.versions.accessString
        args:
          secret_id: infofixhub-automation-token
          version: latest
          project_id: ${projectId}
        result: automationToken
    - getQuestion:
        call: http.get
        args:
          url: '${"https://infofixhub.org/api/automation/questions/" + questionId}'
          timeout: 30
          headers:
            Authorization: ${"Bearer " + automationToken}
        result: questionResponse
    - markResearching:
        call: http.patch
        args:
          url: '${"https://infofixhub.org/api/automation/questions/" + questionId}'
          timeout: 30
          headers:
            Content-Type: "application/json"
            Authorization: ${"Bearer " + automationToken}
          body:
            status: "RESEARCHING"
    - readSearchApiKey:
        call: googleapis.secretmanager.v1.projects.secrets.versions.accessString
        args:
          secret_id: serpapi-api-key
          version: latest
          project_id: ${projectId}
        result: searchApiKey
    - searchGoogle:
        call: http.get
        args:
          url: "https://serpapi.com/search.json"
          timeout: 30
          query:
            engine: "google"
            q: ${questionResponse.body.question.title}
            google_domain: "google.co.kr"
            hl: "ko"
            gl: "kr"
            num: 10
            api_key: ${searchApiKey}
        result: searchResponse
    - collectSources:
        for:
          value: item
          in: ${default(map.get(searchResponse.body, "organic_results"), [])}
          steps:
            - sourceMap:
                assign:
                  - source:
                      title: ${default(map.get(item, "title"), "검색 자료")}
                      url: ${item.link}
                      domain: ${default(map.get(item, "displayed_link"), item.link)}
            - appendSource:
                assign:
                  - sources: ${list.concat(sources, source)}
    - buildResearchInput:
        assign:
          - researchPayload:
              question: ${questionResponse.body.question.title}
              search_results: ${default(map.get(searchResponse.body, "organic_results"), [])}
          - promptText: '${"질문: " + questionResponse.body.question.title + "\n검색 자료 JSON: " + json.encode_to_string(researchPayload)}'
    - readOpenAiApiKey:
        call: googleapis.secretmanager.v1.projects.secrets.versions.accessString
        args:
          secret_id: openai-api-key
          version: latest
          project_id: ${projectId}
        result: openaiApiKey
    - writeDraft:
        call: http.post
        args:
          url: "https://api.openai.com/v1/responses"
          timeout: 90
          headers:
            Content-Type: "application/json"
            Authorization: ${"Bearer " + openaiApiKey}
          body:
            model: "gpt-4.1-mini"
            store: false
            max_output_tokens: 4000
            instructions: "당신은 한국어 검색 가이드 편집자입니다. 제공된 검색 자료에 근거해 정확하고 실용적인 답변 초안을 작성하세요. 확인되지 않은 사실은 만들지 마세요. 실제 문제, 단계별 해결, 주의사항, 확인 방법을 포함하고 출처 링크를 본문 끝에 정리하세요. 광고 문구는 작성하지 마세요."
            input: ${promptText}
            text:
              format:
                type: "json_schema"
                name: "answer_draft"
                strict: true
                schema:
                  type: "object"
                  properties:
                    summary: {type: "string"}
                    contentMarkdown: {type: "string"}
                    contentHtml: {type: "string"}
                    metaTitle: {type: "string"}
                    metaDescription: {type: "string"}
                    confidenceScore: {type: "number"}
                    qualityScore: {type: "number"}
                  required: [summary, contentMarkdown, contentHtml, metaTitle, metaDescription, confidenceScore, qualityScore]
                  additionalProperties: false
        result: openaiResponse
    - parseDraft:
        assign:
          - draft: ${json.decode(openaiResponse.body.output[0].content[0].text)}
    - storeDraft:
        call: http.post
        args:
          url: '${"https://infofixhub.org/api/automation/questions/" + questionId + "/draft"}'
          timeout: 30
          headers:
            Content-Type: "application/json"
            Authorization: ${"Bearer " + automationToken}
          body:
            summary: ${draft.summary}
            contentMarkdown: ${draft.contentMarkdown}
            contentHtml: ${draft.contentHtml}
            metaTitle: ${draft.metaTitle}
            metaDescription: ${draft.metaDescription}
            confidenceScore: ${draft.confidenceScore}
            qualityScore: ${draft.qualityScore}
            provider: "openai"
            model: "gpt-4.1-mini"
            sources: ${sources}
        result: storedDraft
    - returnDraft:
        return:
          workflow: "ANSWER_GENERATION"
          questionId: ${questionId}
          status: "DRAFT"
          humanApprovalRequired: true
          published: false
